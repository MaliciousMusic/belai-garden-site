<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Carte de partage</title>
  <!-- The link-preview card (og:image, 1200 × 630), composed from the SVG and captured once by outils/partage.mjs: the only
       raster image of the shop, for the messengers that want one (owner, 2026-10-31). ?b=<bouquet id>&t=<title> -->
  <style>
    @font-face { font-family: 'Nunito'; font-weight: 200; src: url('../../scene/polices/nunito-extralight.woff2') format('woff2'); }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { position: relative; background: #ffffff; color: #0c1e38;
      font-family: 'Nunito', sans-serif; }
    .marque { position: absolute; left: 72px; top: 64px; height: 46px; aspect-ratio: 11009 / 1750; background: #0c1e38;
      -webkit-mask: url('../logotype.svg') center / contain no-repeat; mask: url('../logotype.svg') center / contain no-repeat; }
    h1 { position: absolute; left: 72px; bottom: 120px; width: 560px; margin: 0; font: 200 72px/1.04 'Nunito', sans-serif; letter-spacing: -0.02em; }
    p { position: absolute; left: 72px; bottom: 70px; margin: 0; font: 400 22px/1.3 system-ui, sans-serif; color: #4b5e78; }
    .bq { position: absolute; right: 70px; bottom: 0; height: 600px; }
  </style>
</head>
<body>
  <div class="marque"></div>
  <h1 id="titre">Nos fleurs vivent sur votre écran.</h1>
  <p id="sous">Bouquets numériques, dessinés et animés tige à tige.</p>
  <img class="bq" id="bq" alt="">
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById('bq').src = `../../scene/bouquets/${q.get('b') || 'printemps-a-la-carpe'}/vignette.svg`;
    if (q.get('t')) document.getElementById('titre').textContent = q.get('t');
    if (q.get('s')) document.getElementById('sous').textContent = q.get('s');
  </script>
</body>
</html>
