<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Trois téléphones | Belai’s Garden</title>
  <!-- outils/telephones.html: the shop on three phones side by side, at their own CSS sizes (owner, 2026-11-01): an iPhone 14
       (390 × 844), a Google Pixel 7 (412 × 915), a Samsung Galaxy S21 (360 × 800). Each phone is the page in a frame of its
       size, the three scaled together to fit the window. ?p=<page> shows another page (default: the landing). A tool for the
       atelier, not a page of the shop. -->
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; background: #ecebe8; font: 14px/1.3 system-ui, sans-serif; color: #1f1a16; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; }
    header form { display: flex; gap: 6px; }
    header input { width: 260px; padding: 6px 8px; border: 1px solid #bbb; border-radius: 6px; font: inherit; }
    header button { padding: 6px 12px; border: 1px solid #1f1a16; border-radius: 6px; background: #fff; font: inherit; cursor: pointer; }
    .rangee { display: flex; justify-content: center; align-items: flex-start; gap: 28px; padding: 6px 16px 24px; }
    figure { margin: 0; display: grid; justify-items: center; gap: 8px; }
    figcaption { font-weight: 600; }
    figcaption small { display: block; font-weight: 400; color: #6b6359; text-align: center; }
    .boitier { position: relative; padding: 12px; border-radius: 42px; background: #111; box-shadow: inset 0 0 0 2px #333; }
    .ecran { position: relative; overflow: hidden; border-radius: 30px; background: #fff; }
    .ecran iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: #fff; }
  </style>
</head>
<body>
  <header>
    <strong>Trois téléphones</strong>
    <form id="f"><input id="p" aria-label="Page" placeholder="index.html"><button>Afficher</button></form>
    <span>iPhone 14 · Google Pixel 7 · Samsung Galaxy S21</span>
  </header>
  <div class="rangee" id="rangee"></div>
  <script>
    const TELS = [
      ['iPhone 14', 390, 844],
      ['Google Pixel 7', 412, 915],
      ['Samsung Galaxy S21', 360, 800],
    ];
    const q = new URLSearchParams(location.search);
    const page = q.get('p') || 'index.html';
    document.getElementById('p').value = page;
    document.getElementById('f').addEventListener('submit', (e) => {
      e.preventDefault();
      location.search = '?p=' + encodeURIComponent(document.getElementById('p').value || 'index.html');
    });
    const rangee = document.getElementById('rangee');
    const ecrans = TELS.map(([nom, w, h]) => {
      const fig = document.createElement('figure');
      fig.innerHTML = `<div class="boitier"><div class="ecran"><iframe title="${nom}" loading="eager"></iframe></div></div><figcaption>${nom}<small>${w} × ${h}</small></figcaption>`;
      const f = fig.querySelector('iframe');
      Object.assign(f.style, { width: w + 'px', height: h + 'px' });
      f.src = '../' + page;
      rangee.append(fig);
      return { fig, ecran: fig.querySelector('.ecran'), f, w, h };
    });
    // the three phones scaled together, the tallest fitting the window's height, the row its width
    function ajuste() {
      const hMax = Math.max(...TELS.map((t) => t[2]));
      const wTot = TELS.reduce((s, t) => s + t[1] + 24, 0) + 28 * (TELS.length - 1);
      const k = Math.min(1, (innerHeight - 120) / (hMax + 24), (innerWidth - 32) / wTot);
      for (const { ecran, f, w, h } of ecrans) {
        Object.assign(ecran.style, { width: w * k + 'px', height: h * k + 'px' });
        f.style.transform = `scale(${k})`;
      }
    }
    addEventListener('resize', ajuste);
    ajuste();
  </script>
</body>
</html>
